<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Formal Methods B-Machine Learning Suite</title>
  <style>
    :root {
      --bg: #090d16;
      --card-bg: #131d31;
      --card-sub: #1e293b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --primary: #38bdf8;
      --primary-hover: #0ea5e9;
      --success: #22c55e;
      --success-bg: rgba(34, 197, 94, 0.15);
      --danger: #ef4444;
      --danger-bg: rgba(239, 68, 68, 0.15);
      --border: #23334d;
      --selected-border: #38bdf8;
      --selected-bg: rgba(56, 189, 248, 0.12);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg);
      color: var(--text-main);
      padding: 1rem 0.75rem;
      display: flex;
      justify-content: center;
      min-height: 100vh;
    }

    .container {
      width: 100%;
      max-width: 820px;
      margin: 0 auto;
    }

    header {
      margin-bottom: 1.25rem;
      text-align: center;
    }

    h1 {
      font-size: 1.45rem;
      font-weight: 700;
      margin-bottom: 0.35rem;
      color: var(--primary);
      letter-spacing: -0.02em;
    }

    .subtitle {
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    @media (min-width: 640px) {
      body { padding: 2rem 1rem; }
      h1 { font-size: 1.85rem; }
      .subtitle { font-size: 0.95rem; }
    }

    /* Square Level Selector Cards */
    .level-dashboard {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 0.65rem;
      margin-bottom: 1.2rem;
    }

    .level-card {
      background-color: var(--card-bg);
      border: 2px solid var(--border);
      border-radius: 12px;
      padding: 0.85rem 0.5rem;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 85px;
    }

    .level-card:hover {
      border-color: var(--primary);
    }

    .level-card.active {
      border-color: var(--primary);
      background-color: var(--selected-bg);
    }

    .level-title {
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--text-main);
      margin-bottom: 0.25rem;
    }

    .level-desc {
      font-size: 0.72rem;
      color: var(--text-muted);
      line-height: 1.2;
    }

    .level-card.active .level-title {
      color: var(--primary);
    }

    /* Square Numbered Box Navigation */
    .boxes-container {
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 0.85rem;
      margin-bottom: 1rem;
    }

    .boxes-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.65rem;
    }

    .boxes-label {
      font-size: 0.78rem;
      font-weight: 600;
      text-transform: uppercase;
      color: var(--text-muted);
      letter-spacing: 0.03em;
    }

    .boxes-counter {
      font-size: 0.8rem;
      color: var(--primary);
      font-weight: 700;
    }

    .boxes-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 0.45rem;
      max-height: 140px;
      overflow-y: auto;
      padding-right: 4px;
    }

    /* Custom Scrollbar for Boxes Grid */
    .boxes-grid::-webkit-scrollbar {
      width: 5px;
    }
    .boxes-grid::-webkit-scrollbar-track {
      background: var(--card-bg);
    }
    .boxes-grid::-webkit-scrollbar-thumb {
      background: var(--border);
      border-radius: 4px;
    }

    .box-btn {
      width: 40px;
      height: 40px;
      border-radius: 8px;
      border: 1.5px solid var(--border);
      background: var(--card-sub);
      color: var(--text-main);
      font-weight: 700;
      font-size: 0.8rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s ease;
      flex-shrink: 0;
    }

    .box-btn:hover {
      border-color: var(--primary);
    }

    .box-btn.active {
      border-color: var(--primary);
      outline: 2px solid var(--primary);
      color: var(--primary);
    }

    .box-btn.solved-correct {
      background-color: var(--success-bg);
      border-color: var(--success);
      color: #86efac;
    }

    .box-btn.solved-incorrect {
      background-color: var(--danger-bg);
      border-color: var(--danger);
      color: #fca5a5;
    }

    /* Main Question Card */
    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.25rem;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.4);
    }

    @media (min-width: 640px) {
      .card { padding: 1.75rem; }
    }

    .meta-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1rem;
      padding-bottom: 0.75rem;
      border-bottom: 1px solid var(--border);
      font-size: 0.82rem;
    }

    .category-badge {
      background-color: rgba(56, 189, 248, 0.12);
      color: var(--primary);
      padding: 0.25rem 0.6rem;
      border-radius: 6px;
      font-weight: 600;
      font-size: 0.75rem;
      text-transform: uppercase;
    }

    .score-badge {
      background-color: var(--card-sub);
      border: 1px solid var(--border);
      padding: 0.25rem 0.65rem;
      border-radius: 6px;
      font-weight: 600;
      color: var(--text-main);
    }

    .score-badge span {
      color: var(--primary);
    }

    .question-text {
      font-size: 1.05rem;
      line-height: 1.55;
      margin-bottom: 1.25rem;
      white-space: pre-line;
      color: var(--text-main);
      font-weight: 500;
    }

    @media (min-width: 640px) {
      .question-text { font-size: 1.15rem; }
    }

    /* Options */
    .options-grid {
      display: flex;
      flex-direction: column;
      gap: 0.65rem;
      margin-bottom: 1.25rem;
    }

    .option-btn {
      width: 100%;
      text-align: left;
      background: var(--card-sub);
      border: 1.5px solid var(--border);
      color: var(--text-main);
      padding: 0.85rem 1rem;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.92rem;
      line-height: 1.45;
      display: flex;
      align-items: flex-start;
      gap: 0.65rem;
      transition: all 0.15s ease;
      min-height: 48px;
    }

    .option-btn strong {
      color: var(--primary);
      flex-shrink: 0;
    }

    .option-btn.selected {
      border-color: var(--selected-border);
      background-color: var(--selected-bg);
    }

    .option-btn.correct {
      border-color: var(--success) !important;
      background-color: var(--success-bg) !important;
      color: #86efac;
    }

    .option-btn.correct strong { color: #86efac; }

    .option-btn.incorrect {
      border-color: var(--danger) !important;
      background-color: var(--danger-bg) !important;
      color: #fca5a5;
    }

    .option-btn.incorrect strong { color: #fca5a5; }

    .option-btn:disabled {
      cursor: default;
    }

    /* Feedback & Explanation */
    .feedback-banner {
      padding: 0.75rem 1rem;
      border-radius: 8px;
      font-size: 0.88rem;
      font-weight: 600;
      margin-bottom: 1rem;
    }

    .feedback-banner.correct {
      background-color: var(--success-bg);
      color: #86efac;
      border: 1px solid var(--success);
    }

    .feedback-banner.incorrect {
      background-color: var(--danger-bg);
      color: #fca5a5;
      border: 1px solid var(--danger);
    }

    .explanation {
      background: var(--card-sub);
      border-left: 3px solid var(--primary);
      padding: 0.85rem 1rem;
      font-size: 0.88rem;
      line-height: 1.45;
      margin-bottom: 1.25rem;
      color: var(--text-muted);
      border-radius: 0 8px 8px 0;
    }

    .explanation strong {
      color: var(--text-main);
      display: block;
      margin-bottom: 0.25rem;
    }

    /* Buttons */
    .action-row {
      display: flex;
      justify-content: flex-end;
      gap: 0.5rem;
    }

    .btn {
      width: 100%;
      background-color: var(--primary);
      color: #04101e;
      border: none;
      padding: 0.85rem 1.25rem;
      font-weight: 700;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.95rem;
      min-height: 48px;
      transition: background-color 0.15s ease, opacity 0.15s ease;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    @media (min-width: 640px) {
      .btn {
        width: auto;
        min-width: 160px;
      }
    }

    .btn:hover:not(:disabled) { background-color: var(--primary-hover); }
    .btn:disabled { opacity: 0.45; cursor: not-allowed; }

    /* Summary */
    .score-screen {
      text-align: center;
      padding: 1.5rem 0;
    }

    .score-num {
      font-size: 3.5rem;
      font-weight: 800;
      color: var(--primary);
      margin: 0.85rem 0;
      line-height: 1;
    }

    .status-msg {
      text-align: center;
      padding: 2.5rem 1rem;
      color: var(--text-muted);
      font-size: 0.95rem;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>Formal Methods B-Machine Engine</h1>
      <p class="subtitle">Select difficulty level and question box to start</p>
    </header>

    <!-- Difficulty Level Selector Boxes -->
    <div class="level-dashboard">
      <div class="level-card active" data-level="easy">
        <div class="level-title">EASY</div>
        <div class="level-desc">Theory Foundations (Q1–80)</div>
      </div>
      <div class="level-card" data-level="mid">
        <div class="level-title">MID</div>
        <div class="level-desc">Algebra & Logic (Q81–160)</div>
      </div>
      <div class="level-card" data-level="exam">
        <div class="level-title">EXAM</div>
        <div class="level-desc">AMN & Verification (Q161–240)</div>
      </div>
    </div>

    <!-- Square Numbered Boxes for Active Level -->
    <div class="boxes-container">
      <div class="boxes-header">
        <span class="boxes-label" id="boxesLabel">Level Questions</span>
        <span class="boxes-counter" id="boxesCounter">0 / 80 Solved</span>
      </div>
      <div class="boxes-grid" id="boxesGrid"></div>
    </div>

    <!-- Main Question Container -->
    <main id="quizApp" class="card">
      <div id="loading" class="status-msg">Loading question bank...</div>
    </main>
  </div>

  <script>
    const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwmmzUuu6n6u6P5oYszuMgcJhiCyS_34EXQKaKrzu1ARmFojxhFBO5_6bTq1HpuTOXUzA/exec';

    let activeLevel = 'easy';
    let currentQuestions = [];
    let currentIndex = 0;
    let userAnswers = {}; // { qIndex: { selected: 'B', isCorrect: true } }
    let selectedOption = null;

    const quizApp = document.getElementById('quizApp');
    const boxesGrid = document.getElementById('boxesGrid');
    const boxesLabel = document.getElementById('boxesLabel');
    const boxesCounter = document.getElementById('boxesCounter');
    const levelCards = document.querySelectorAll('.level-card');

    levelCards.forEach(card => {
      card.addEventListener('click', () => {
        levelCards.forEach(c => c.classList.remove('active'));
        card.classList.add('active');
        activeLevel = card.getAttribute('data-level');
        fetchLevelQuestions(activeLevel);
      });
    });

    async function fetchLevelQuestions(levelKey) {
      quizApp.innerHTML = '<div class="status-msg">Loading question batch...</div>';
      userAnswers = {};
      selectedOption = null;

      try {
        const response = await fetch(`${APPS_SCRIPT_URL}?level=${levelKey}`, {
          method: 'GET',
          redirect: 'follow'
        });

        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const data = await response.json();

        if (data && data.questions && data.questions.length > 0) {
          currentQuestions = data.questions;
        } else {
          quizApp.innerHTML = `<div class="status-msg" style="color: var(--danger);">No questions returned for level: ${escapeHtml(levelKey)}</div>`;
          return;
        }
      } catch (err) {
        console.warn('Backend fetch failed, ensure Google Sheet has data and script is deployed as Anyone:', err);
        quizApp.innerHTML = `<div class="status-msg" style="color: var(--danger); line-height: 1.5;">
          Unable to reach Google Sheet API.<br><br>
          <small>Ensure the Apps Script deployment access is set to <strong>"Anyone"</strong> and you have deployed a <strong>New version</strong>.</small>
        </div>`;
        return;
      }

      currentIndex = 0;
      updateBoxStats();
      renderBoxes();
      renderQuestion();
    }

    function updateBoxStats() {
      const solvedCount = Object.keys(userAnswers).length;
      boxesLabel.innerText = `${activeLevel.toUpperCase()} QUESTIONS`;
      boxesCounter.innerText = `${solvedCount} / ${currentQuestions.length} Solved`;
    }

    function renderBoxes() {
      boxesGrid.innerHTML = '';
      currentQuestions.forEach((q, idx) => {
        const box = document.createElement('button');
        box.className = 'box-btn';
        box.innerText = String(idx + 1).padStart(2, '0');

        if (idx === currentIndex) box.classList.add('active');
        if (userAnswers[idx]) {
          box.classList.add(userAnswers[idx].isCorrect ? 'solved-correct' : 'solved-incorrect');
        }

        box.addEventListener('click', () => {
          currentIndex = idx;
          selectedOption = null;
          renderBoxes();
          renderQuestion();
        });

        boxesGrid.appendChild(box);
      });
    }

    function calculateRunningMark() {
      const attempted = Object.keys(userAnswers).length;
      if (attempted === 0) return 0;
      const correct = Object.values(userAnswers).filter(a => a.isCorrect).length;
      return Math.round((correct / attempted) * 100);
    }

    function renderQuestion() {
      if (!currentQuestions.length) return;

      const q = currentQuestions[currentIndex];
      const optKeys = ['A', 'B', 'C', 'D'];
      const pastAnswer = userAnswers[currentIndex];
      const runningMark = calculateRunningMark();

      quizApp.innerHTML = `
        <div class="meta-bar">
          <span class="category-badge">${escapeHtml(q.category || activeLevel)}</span>
          <span class="score-badge">Box ${String(currentIndex + 1).padStart(2, '0')}/${currentQuestions.length} | Mark: <span>${runningMark}/100</span></span>
        </div>

        <div class="question-text">${escapeHtml(q.question)}</div>

        <div class="options-grid">
          ${optKeys.map(k => `
            <button class="option-btn" data-opt="${k}">
              <strong>${k}:</strong>
              <span>${escapeHtml(q.options[k] || '')}</span>
            </button>
          `).join('')}
        </div>

        <div id="feedbackContainer"></div>

        <div class="action-row">
          <button class="btn" id="actionBtn" disabled>Submit Answer</button>
        </div>
      `;

      const optionButtons = quizApp.querySelectorAll('.option-btn');
      const actionBtn = document.getElementById('actionBtn');

      if (pastAnswer) {
        optionButtons.forEach(btn => {
          btn.disabled = true;
          const opt = btn.getAttribute('data-opt');
          if (opt === q.correct) btn.classList.add('correct');
          if (opt === pastAnswer.selected && !pastAnswer.isCorrect) btn.classList.add('incorrect');
        });

        showFeedback(pastAnswer.isCorrect, q.correct, q.explanation, runningMark);
        actionBtn.innerText = currentIndex === currentQuestions.length - 1 ? 'View Level Summary' : 'Next Question';
        actionBtn.disabled = false;
        actionBtn.onclick = handleNext;
        return;
      }

      selectedOption = null;
      optionButtons.forEach(btn => {
        btn.addEventListener('click', () => {
          optionButtons.forEach(b => b.classList.remove('selected'));
          btn.classList.add('selected');
          selectedOption = btn.getAttribute('data-opt');
          actionBtn.disabled = false;
        });
      });

      actionBtn.onclick = () => handleSubmit(q, actionBtn);
    }

    function handleSubmit(q, actionBtn) {
      if (!selectedOption) return;

      const isCorrect = selectedOption === q.correct;
      userAnswers[currentIndex] = { selected: selectedOption, isCorrect };

      const runningMark = calculateRunningMark();

      const optionButtons = quizApp.querySelectorAll('.option-btn');
      optionButtons.forEach(btn => {
        btn.disabled = true;
        const opt = btn.getAttribute('data-opt');
        if (opt === q.correct) btn.classList.add('correct');
        if (opt === selectedOption && !isCorrect) btn.classList.add('incorrect');
      });

      showFeedback(isCorrect, q.correct, q.explanation, runningMark);
      updateBoxStats();
      renderBoxes();

      const isLast = currentIndex === currentQuestions.length - 1;
      actionBtn.innerText = isLast ? 'View Level Summary' : 'Next Question';
      actionBtn.onclick = handleNext;
    }

    function showFeedback(isCorrect, correctOpt, explanation, mark) {
      const feedbackContainer = document.getElementById('feedbackContainer');
      feedbackContainer.innerHTML = `
        <div class="feedback-banner ${isCorrect ? 'correct' : 'incorrect'}">
          ${isCorrect ? '✓ Correct Answer' : '✕ Incorrect (Correct: Option ' + correctOpt + ')'} — Current Mark: ${mark}/100
        </div>
        ${explanation ? `
          <div class="explanation">
            <strong>Theoretical Explanation:</strong>
            ${escapeHtml(explanation)}
          </div>
        ` : ''}
      `;

      const scoreBadge = quizApp.querySelector('.score-badge span');
      if (scoreBadge) scoreBadge.innerText = `${mark}/100`;
    }

    function handleNext() {
      if (currentIndex < currentQuestions.length - 1) {
        currentIndex++;
        renderBoxes();
        renderQuestion();
      } else {
        renderSummary();
      }
    }

    function renderSummary() {
      const total = currentQuestions.length;
      const correctCount = Object.values(userAnswers).filter(a => a.isCorrect).length;
      const finalScore = total > 0 ? Math.round((correctCount / total) * 100) : 0;

      quizApp.innerHTML = `
        <div class="score-screen">
          <h2>${activeLevel.toUpperCase()} Completed</h2>
          <div class="score-num">${finalScore}<span style="font-size: 2rem; color: var(--text-muted);">/100</span></div>
          <p style="color: var(--text-muted); margin-bottom: 1.5rem;">${correctCount} out of ${total} questions solved correctly</p>
          <button class="btn" style="margin: 0 auto;" onclick="fetchLevelQuestions(activeLevel)">Restart Level</button>
        </div>
      `;
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    // Auto load Easy level on load
    window.addEventListener('load', () => fetchLevelQuestions('easy'));
  </script>
</body>
</html>
