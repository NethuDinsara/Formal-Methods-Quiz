<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Formal Methods Daily Quiz Engine</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --primary: #38bdf8;
      --primary-hover: #0ea5e9;
      --success: #22c55e;
      --danger: #ef4444;
      --border: #334155;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text-main);
      padding: 2rem 1rem;
      display: flex;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 760px;
    }

    header {
      margin-bottom: 1.5rem;
      text-align: center;
    }

    h1 {
      font-size: 1.75rem;
      font-weight: 700;
      margin-bottom: 1rem;
      color: var(--primary);
    }

    .day-selector {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      justify-content: center;
    }

    .day-btn {
      background-color: var(--card-bg);
      color: var(--text-muted);
      border: 1px solid var(--border);
      padding: 0.5rem 0.85rem;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.85rem;
      transition: all 0.2s ease;
    }

    .day-btn:hover {
      border-color: var(--primary);
      color: var(--text-main);
    }

    .day-btn.active {
      background-color: var(--primary);
      color: #000;
      font-weight: 600;
      border-color: var(--primary);
    }

    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 1.75rem;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.25);
    }

    .quiz-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.25rem;
      padding-bottom: 0.75rem;
      border-bottom: 1px solid var(--border);
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .category-badge {
      background-color: rgba(56, 189, 248, 0.1);
      color: var(--primary);
      padding: 0.2rem 0.6rem;
      border-radius: 4px;
    }

    .question-text {
      font-size: 1.15rem;
      line-height: 1.5;
      margin-bottom: 1.5rem;
      white-space: pre-line;
    }

    .options-grid {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      margin-bottom: 1.5rem;
    }

    .option-btn {
      text-align: left;
      background: #0f172a;
      border: 1px solid var(--border);
      color: var(--text-main);
      padding: 0.85rem 1rem;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.95rem;
      transition: all 0.15s ease;
      display: flex;
      align-items: flex-start;
      gap: 0.6rem;
    }

    .option-btn:hover:not(:disabled) {
      border-color: var(--primary);
    }

    .option-btn:disabled {
      cursor: default;
    }

    .option-btn.correct {
      border-color: var(--success);
      background-color: rgba(34, 197, 94, 0.15);
      color: #86efac;
    }

    .option-btn.incorrect {
      border-color: var(--danger);
      background-color: rgba(239, 68, 68, 0.15);
      color: #fca5a5;
    }

    .explanation {
      background: #0f172a;
      border-left: 3px solid var(--primary);
      padding: 0.85rem 1rem;
      font-size: 0.9rem;
      line-height: 1.4;
      margin-bottom: 1.5rem;
      color: var(--text-muted);
    }

    .explanation strong {
      color: var(--text-main);
      display: block;
      margin-bottom: 0.25rem;
    }

    .action-row {
      display: flex;
      justify-content: flex-end;
    }

    .next-btn {
      background-color: var(--primary);
      color: #000;
      border: none;
      padding: 0.65rem 1.25rem;
      font-weight: 600;
      border-radius: 6px;
      cursor: pointer;
    }

    .next-btn:hover {
      background-color: var(--primary-hover);
    }

    .score-screen {
      text-align: center;
      padding: 1.5rem 0;
    }

    .score-screen h2 {
      margin-bottom: 0.5rem;
      font-size: 1.5rem;
    }

    .score-num {
      font-size: 3rem;
      font-weight: 700;
      color: var(--primary);
      margin: 1rem 0;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>Formal Methods Daily Quiz</h1>
      <nav class="day-selector" id="daySelector">
        <button class="day-btn active" data-day="1">Day 1</button>
        <button class="day-btn" data-day="2">Day 2</button>
        <button class="day-btn" data-day="3">Day 3</button>
        <button class="day-btn" data-day="4">Day 4</button>
        <button class="day-btn" data-day="5">Day 5+ (Exam Mode)</button>
      </nav>
    </header>

    <main id="quizApp" class="card"></main>
  </div>

  <script>
    const QUESTION_BANK = [
      {
        id: "Q1",
        category: "Set Theory",
        question: "Given universal range D = 1..12, and defined subsets A = {1, 2, 3, 4, 5, 6, 7, 8}, B = {1, 4, 7, 9, 10}, and C = {2, 4, 6}, what is the result of the B set expression (A - B) /\\ C?",
        options: { A: "{2, 4, 6}", B: "{2, 6}", C: "{1, 4, 7}", D: "{3, 5, 8}" },
        correct: "B",
        explanation: "A \\ B = {2, 3, 5, 6, 8}. Intersecting with C = {2, 4, 6} yields {2, 6}."
      },
      {
        id: "Q2",
        category: "Set Theory",
        question: "For M = {x | x : NAT & x <= 15 & x mod 3 = 0}, N = {y | y : NAT & y <= 15 & y mod 2 = 1}, and P = {{2, 4}, {4, 6, 8}, {8, 10, 12}}, which statement is TRUE?",
        options: { A: "⋂ P = {4}", B: "(3 : M) & (3 /: N)", C: "min(M) = min(N) or 3..9 <: (N \\/ M)", D: "(M - N) /= (N - M)" },
        correct: "D",
        explanation: "M \\ N = {0, 6, 12} while N \\ M = {1, 5, 7, 11, 13}, so (M - N) /= (N - M) is TRUE."
      },
      {
        id: "Q3",
        category: "Binary Relations",
        question: "Given favourites = { Alice |-> Black, Alice |-> Green, Bob |-> Red, Carl |-> Blue, Ellen |-> Green }, what is the result of the relational override favourites <+ { Bob |-> Green, Dina |-> Red }?",
        options: {
          A: "{ Alice |-> Black, Alice |-> Green, Bob |-> Red, Bob |-> Green, Carl |-> Blue, Ellen |-> Green, Dina |-> Red }",
          B: "{ Alice |-> Black, Alice |-> Green, Bob |-> Green, Carl |-> Blue, Ellen |-> Green, Dina |-> Red }",
          C: "{ Bob |-> Green, Dina |-> Red }",
          D: "{ Alice |-> Black, Alice |-> Green, Carl |-> Blue, Ellen |-> Green }"
        },
        correct: "B",
        explanation: "Override replaces Bob's targets with Green, adds Dina |-> Red, and preserves others."
      },
      {
        id: "Q4",
        category: "Binary Relations",
        question: "Given favorite_subject = {Alice|->Math, Alice|->Science, Bob|->History, Charlie|->Art, David|->English, Eve|->Music, Frank|->Science}, what is the result of favorite_subject |>> {Math, Science, History}?",
        options: {
          A: "{Alice |-> Math, Alice |-> Science, Bob |-> History}",
          B: "{Charlie |-> Art, David |-> English, Eve |-> Music}",
          C: "{Charlie, David, Eve}",
          D: "{Art, English, Music}"
        },
        correct: "B",
        explanation: "Range anti-restriction removes pairs pointing to Math, Science, or History."
      },
      {
        id: "Q5",
        category: "Functions",
        question: "A system mandates mapping every registered Employee to a unique system ID. Every employee must have an ID, no two employees share an ID, and some IDs may remain unassigned. Which B function arrow models this?",
        options: {
          A: "hasEmployeeID : Employee +-> ID",
          B: "hasEmployeeID : Employee -->> ID",
          C: "hasEmployeeID : Employee >-> ID",
          D: "hasEmployeeID : Employee >->> ID"
        },
        correct: "C",
        explanation: "Totality + Injectivity + Non-surjectivity = Total Injection (>->)."
      },
      {
        id: "Q6",
        category: "Functions",
        question: "Given Vehicle = {Car, Bus, Bike, Boat, Plane} and Fuel = {Petrol, Diesel, Electric, None}, with fuelType = {Car|->Petrol, Bus|->Diesel, Bike|->Electric, Boat|->Diesel, Plane|->Petrol}, what is the classification of fuelType?",
        options: {
          A: "Total Function (Vehicle --> Fuel)",
          B: "Total Injection (Vehicle >-> Fuel)",
          C: "Partial Function (Vehicle +-> Fuel)",
          D: "Total Bijection (Vehicle >->> Fuel)"
        },
        correct: "A",
        explanation: "Every vehicle maps to a fuel, but Petrol is shared and None is unused. Hence total function."
      },
      {
        id: "Q7",
        category: "Predicate Logic",
        question: "Given A = {4, 6, 10} and B = {2, 3, 5}, evaluate Predicate 1: !(xx).(xx : A => #(yy).(yy : B & xx mod yy = 0)) and Predicate 2: #(yy).(yy : B & !(xx).(xx : A => xx mod yy = 0)).",
        options: {
          A: "Predicate 1 is True; Predicate 2 is True",
          B: "Predicate 1 is True; Predicate 2 is False",
          C: "Predicate 1 is False; Predicate 2 is True",
          D: "Predicate 1 is False; Predicate 2 is False"
        },
        correct: "A",
        explanation: "yy = 2 in B divides all elements in A, satisfying both predicates."
      },
      {
        id: "Q8",
        category: "Predicate Logic",
        question: "Given A = {1, 2, 3, 4, 5} and B = {2, 3, 5, 7} over NAT, which of the following logical statements evaluates to TRUE?",
        options: {
          A: "!(n).(n : A => n+1 : B)",
          B: "!(n).(n : A => #(m).(m : B & m < n))",
          C: "#(n).(n : A & !(m).(m : B => m < n))",
          D: "#(n).(n : B & n+1 : A)"
        },
        correct: "D",
        explanation: "For n = 2 in B, n + 1 = 3 is in A. The witness holds."
      },
      {
        id: "Q9",
        category: "Relations & Orders",
        question: "Let A = {1, 2, 3} and R = {(1,1), (2,2), (3,3), (1,2)}. Is R an equivalence relation on A?",
        options: {
          A: "Yes, R satisfies reflexivity, symmetry, and transitivity.",
          B: "No, R violates reflexivity.",
          C: "No, R is reflexive and transitive but violates symmetry.",
          D: "No, R is symmetric but violates transitivity."
        },
        correct: "C",
        explanation: "Contains identity elements and is transitive, but missing (2,1) so symmetry fails."
      },
      {
        id: "Q10",
        category: "Relations & Orders",
        question: "On set A = {1, 2, 3}, which of the following relations constitutes an EQUIVALENCE RELATION?",
        options: {
          A: "R = {(1,1), (2,2), (1,2), (2,1), (1,3), (3,1)}",
          B: "R = {(1,1), (2,2), (3,3), (1,2)}",
          C: "R = {(1,1), (2,2), (3,3), (1,2), (2,1), (2,3), (3,2), (1,3), (3,1)}",
          D: "R = {(1,1), (2,2), (3,3), (1,2), (2,1), (1,3), (3,1)}"
        },
        correct: "C",
        explanation: "Full Cartesian product A x A satisfies reflexivity, symmetry, and transitivity."
      },
      {
        id: "Q11",
        category: "Abstract Machine Notation",
        question: "In B-Method, if operation addNewHouse(newHouse) has precondition PRE newHouse : NAT1 & newHouse /: houseNumbers THEN houseNumbers := houseNumbers \\/ {newHouse} END, what occurs if invoked when newHouse /: houseNumbers is False?",
        options: {
          A: "The machine automatically invokes an ELSE fallback path and ignores the operation.",
          B: "A precondition contract violation occurs, invalidating proof obligations and causing undefined behavior.",
          C: "The machine adds the duplicate value to houseNumbers without throwing an exception.",
          D: "The variable houseNumbers is re-initialized to the empty set {}."
        },
        correct: "B",
        explanation: "Violating an operation's precondition breaches the contract, leading to undefined behavior."
      }
    ];

    let currentQuestions = [];
    let currentIndex = 0;
    let score = 0;
    let answered = false;

    const quizApp = document.getElementById('quizApp');
    const daySelector = document.getElementById('daySelector');

    function loadQuiz(isExamMode) {
      if (isExamMode) {
        currentQuestions = [...QUESTION_BANK].sort(() => Math.random() - 0.5);
      } else {
        currentQuestions = [...QUESTION_BANK];
      }
      currentIndex = 0;
      score = 0;
      renderCurrentQuestion();
    }

    daySelector.addEventListener('click', (e) => {
      const btn = e.target.closest('.day-btn');
      if (!btn) return;
      document.querySelectorAll('.day-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      const day = parseInt(btn.getAttribute('data-day'), 10);
      loadQuiz(day > 4);
    });

    function renderCurrentQuestion() {
      answered = false;
      const q = currentQuestions[currentIndex];
      const optKeys = ['A', 'B', 'C', 'D'];

      quizApp.innerHTML = `
        <div class="quiz-header">
          <span class="category-badge">${escapeHtml(q.category)}</span>
          <span>Question ${currentIndex + 1} of ${currentQuestions.length}</span>
        </div>
        <div class="question-text">${escapeHtml(q.question)}</div>
        <div class="options-grid">
          ${optKeys.map(k => `
            <button class="option-btn" data-opt="${k}">
              <strong>${k}:</strong> <span>${escapeHtml(q.options[k] || '')}</span>
            </button>
          `).join('')}
        </div>
        <div id="explanationBox" style="display: none;"></div>
        <div class="action-row" id="actionRow" style="display: none;">
          <button class="next-btn" id="nextBtn">
            ${currentIndex === currentQuestions.length - 1 ? 'Finish Quiz' : 'Next Question'}
          </button>
        </div>
      `;

      quizApp.querySelectorAll('.option-btn').forEach(btn => {
        btn.addEventListener('click', () => handleOptionClick(btn, q));
      });

      document.getElementById('nextBtn').addEventListener('click', handleNext);
    }

    function handleOptionClick(clickedBtn, q) {
      if (answered) return;
      answered = true;

      const chosen = clickedBtn.getAttribute('data-opt');
      const isCorrect = chosen === q.correct;

      if (isCorrect) {
        score++;
        clickedBtn.classList.add('correct');
      } else {
        clickedBtn.classList.add('incorrect');
        const correctBtn = quizApp.querySelector(`.option-btn[data-opt="${q.correct}"]`);
        if (correctBtn) correctBtn.classList.add('correct');
      }

      quizApp.querySelectorAll('.option-btn').forEach(b => b.disabled = true);

      if (q.explanation) {
        const expBox = document.getElementById('explanationBox');
        expBox.className = 'explanation';
        expBox.innerHTML = `<strong>Explanation:</strong> ${escapeHtml(q.explanation)}`;
        expBox.style.display = 'block';
      }

      document.getElementById('actionRow').style.display = 'flex';
    }

    function handleNext() {
      currentIndex++;
      if (currentIndex < currentQuestions.length) {
        renderCurrentQuestion();
      } else {
        renderCompletion();
      }
    }

    function renderCompletion() {
      const total = currentQuestions.length;
      const pct = Math.round((score / total) * 100);

      quizApp.innerHTML = `
        <div class="score-screen">
          <h2>Quiz Completed</h2>
          <div class="score-num">${score} / ${total}</div>
          <p>${pct}% Accuracy</p>
        </div>
      `;
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    // Auto-load questions immediately
    loadQuiz(false);
  </script>
</body>
</html>
