<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Formal Methods Daily Quiz Engine</title>
  <style>
    :root {
      --bg: #0b1120;
      --card-bg: #1e293b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --primary: #38bdf8;
      --primary-hover: #0ea5e9;
      --success: #22c55e;
      --success-bg: rgba(34, 197, 94, 0.15);
      --danger: #ef4444;
      --danger-bg: rgba(239, 68, 68, 0.15);
      --border: #334155;
      --selected-border: #38bdf8;
      --selected-bg: rgba(56, 189, 248, 0.12);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg);
      color: var(--text-main);
      padding: 1rem 0.75rem;
      display: flex;
      justify-content: center;
      min-height: 100vh;
    }

    .container {
      width: 100%;
      max-width: 720px;
      margin: 0 auto;
    }

    header {
      margin-bottom: 1.25rem;
      text-align: center;
    }

    h1 {
      font-size: 1.45rem;
      font-weight: 700;
      margin-bottom: 0.85rem;
      color: var(--primary);
      letter-spacing: -0.02em;
    }

    @media (min-width: 640px) {
      body {
        padding: 2rem 1rem;
      }
      h1 {
        font-size: 1.8rem;
      }
    }

    /* Day Tabs */
    .day-selector {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
      justify-content: center;
    }

    .day-btn {
      background-color: var(--card-bg);
      color: var(--text-muted);
      border: 1px solid var(--border);
      padding: 0.55rem 0.85rem;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.8rem;
      font-weight: 500;
      transition: all 0.2s ease;
      flex: 1 1 calc(33.333% - 0.4rem);
      text-align: center;
      max-width: 160px;
    }

    .day-btn:hover {
      border-color: var(--primary);
      color: var(--text-main);
    }

    .day-btn.active {
      background-color: var(--primary);
      color: #04101e;
      font-weight: 700;
      border-color: var(--primary);
    }

    /* Main Card */
    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.25rem;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.4);
      margin-top: 0.75rem;
    }

    @media (min-width: 640px) {
      .card {
        padding: 1.75rem;
      }
    }

    /* Progress & Tracker Bar */
    .meta-bar {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 0.5rem;
      margin-bottom: 1.2rem;
      padding-bottom: 0.75rem;
      border-bottom: 1px solid var(--border);
      font-size: 0.85rem;
    }

    .category-badge {
      background-color: rgba(56, 189, 248, 0.12);
      color: var(--primary);
      padding: 0.25rem 0.65rem;
      border-radius: 6px;
      font-weight: 600;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .score-badge {
      background-color: #0f172a;
      border: 1px solid var(--border);
      color: var(--text-main);
      padding: 0.25rem 0.65rem;
      border-radius: 6px;
      font-weight: 600;
      font-size: 0.8rem;
    }

    .score-badge span {
      color: var(--primary);
    }

    /* Question */
    .question-text {
      font-size: 1.05rem;
      line-height: 1.55;
      margin-bottom: 1.25rem;
      white-space: pre-line;
      color: var(--text-main);
      font-weight: 500;
    }

    @media (min-width: 640px) {
      .question-text {
        font-size: 1.15rem;
      }
    }

    /* Options */
    .options-grid {
      display: flex;
      flex-direction: column;
      gap: 0.65rem;
      margin-bottom: 1.25rem;
    }

    .option-btn {
      width: 100%;
      text-align: left;
      background: #0f172a;
      border: 1.5px solid var(--border);
      color: var(--text-main);
      padding: 0.85rem 1rem;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.92rem;
      line-height: 1.45;
      display: flex;
      align-items: flex-start;
      gap: 0.65rem;
      transition: border-color 0.15s ease, background-color 0.15s ease;
      min-height: 48px;
    }

    .option-btn:focus-visible {
      outline: 2px solid var(--primary);
    }

    .option-btn strong {
      color: var(--primary);
      flex-shrink: 0;
      margin-top: 0.05rem;
    }

    .option-btn.selected {
      border-color: var(--selected-border);
      background-color: var(--selected-bg);
    }

    .option-btn.correct {
      border-color: var(--success) !important;
      background-color: var(--success-bg) !important;
      color: #86efac;
    }

    .option-btn.correct strong {
      color: #86efac;
    }

    .option-btn.incorrect {
      border-color: var(--danger) !important;
      background-color: var(--danger-bg) !important;
      color: #fca5a5;
    }

    .option-btn.incorrect strong {
      color: #fca5a5;
    }

    .option-btn:disabled {
      cursor: default;
    }

    /* Feedback Banner */
    .feedback-banner {
      padding: 0.75rem 1rem;
      border-radius: 8px;
      font-size: 0.9rem;
      font-weight: 600;
      margin-bottom: 1rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .feedback-banner.correct {
      background-color: var(--success-bg);
      color: #86efac;
      border: 1px solid var(--success);
    }

    .feedback-banner.incorrect {
      background-color: var(--danger-bg);
      color: #fca5a5;
      border: 1px solid var(--danger);
    }

    /* Explanation */
    .explanation {
      background: #0f172a;
      border-left: 3px solid var(--primary);
      padding: 0.85rem 1rem;
      font-size: 0.88rem;
      line-height: 1.5;
      margin-bottom: 1.25rem;
      color: var(--text-muted);
      border-radius: 0 8px 8px 0;
    }

    .explanation strong {
      color: var(--text-main);
      display: block;
      margin-bottom: 0.25rem;
    }

    /* Actions */
    .action-row {
      display: flex;
      justify-content: flex-end;
      gap: 0.5rem;
    }

    .btn {
      width: 100%;
      background-color: var(--primary);
      color: #04101e;
      border: none;
      padding: 0.85rem 1.25rem;
      font-weight: 700;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.95rem;
      transition: background-color 0.15s ease, opacity 0.15s ease;
      min-height: 48px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    @media (min-width: 640px) {
      .btn {
        width: auto;
        min-width: 160px;
      }
    }

    .btn:hover:not(:disabled) {
      background-color: var(--primary-hover);
    }

    .btn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    /* Results Screen */
    .score-screen {
      text-align: center;
      padding: 1.5rem 0;
    }

    .score-num {
      font-size: 3.5rem;
      font-weight: 800;
      color: var(--primary);
      margin: 0.85rem 0;
      line-height: 1;
    }

    .score-grade {
      font-size: 1.15rem;
      color: var(--text-muted);
      margin-bottom: 1.5rem;
    }

    .status-msg {
      text-align: center;
      padding: 2.5rem 1rem;
      color: var(--text-muted);
      font-size: 0.95rem;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>Formal Methods Daily Quiz</h1>
      <nav class="day-selector" id="daySelector">
        <button class="day-btn active" data-day="1">Day 1</button>
        <button class="day-btn" data-day="2">Day 2</button>
        <button class="day-btn" data-day="3">Day 3</button>
        <button class="day-btn" data-day="4">Day 4</button>
        <button class="day-btn" data-day="5">Day 5+ (Exam)</button>
      </nav>
    </header>

    <main id="quizApp" class="card">
      <div id="loading" class="status-msg">Loading practice batch...</div>
    </main>
  </div>

  <script>
    const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwmmzUuu6n6u6P5oYszuMgcJhiCyS_34EXQKaKrzu1ARmFojxhFBO5_6bTq1HpuTOXUzA/exec';

    const FALLBACK_QUESTIONS = [
      {
        id: "Q1",
        category: "Set Theory",
        question: "Given universal range D = 1..12, and defined subsets A = {1, 2, 3, 4, 5, 6, 7, 8}, B = {1, 4, 7, 9, 10}, and C = {2, 4, 6}, what is the result of the B set expression (A - B) /\\ C?",
        options: { A: "{2, 4, 6}", B: "{2, 6}", C: "{1, 4, 7}", D: "{3, 5, 8}" },
        correct: "B",
        explanation: "A \\ B = {2, 3, 5, 6, 8}. Intersecting with C = {2, 4, 6} yields {2, 6}."
      },
      {
        id: "Q2",
        category: "Set Theory",
        question: "For M = {x | x : NAT & x <= 15 & x mod 3 = 0}, N = {y | y : NAT & y <= 15 & y mod 2 = 1}, and P = {{2, 4}, {4, 6, 8}, {8, 10, 12}}, which statement is TRUE?",
        options: { A: "⋂ P = {4}", B: "(3 : M) & (3 /: N)", C: "min(M) = min(N) or 3..9 <: (N \\/ M)", D: "(M - N) /= (N - M)" },
        correct: "D",
        explanation: "M \\ N = {0, 6, 12} while N \\ M = {1, 5, 7, 11, 13}, so (M - N) /= (N - M) is TRUE."
      },
      {
        id: "Q3",
        category: "Binary Relations",
        question: "Given favourites = { Alice |-> Black, Alice |-> Green, Bob |-> Red, Carl |-> Blue, Ellen |-> Green }, what is the result of the relational override favourites <+ { Bob |-> Green, Dina |-> Red }?",
        options: {
          A: "{ Alice |-> Black, Alice |-> Green, Bob |-> Red, Bob |-> Green, Carl |-> Blue, Ellen |-> Green, Dina |-> Red }",
          B: "{ Alice |-> Black, Alice |-> Green, Bob |-> Green, Carl |-> Blue, Ellen |-> Green, Dina |-> Red }",
          C: "{ Bob |-> Green, Dina |-> Red }",
          D: "{ Alice |-> Black, Alice |-> Green, Carl |-> Blue, Ellen |-> Green }"
        },
        correct: "B",
        explanation: "Relational override (<+) replaces existing maplets for keys in the domain of the overriding relation (Bob) and appends new pairs (Dina)."
      },
      {
        id: "Q4",
        category: "Binary Relations",
        question: "Given favorite_subject = {Alice|->Math, Alice|->Science, Bob|->History, Charlie|->Art, David|->English, Eve|->Music, Frank|->Science}, what is the result of favorite_subject |>> {Math, Science, History}?",
        options: {
          A: "{Alice |-> Math, Alice |-> Science, Bob |-> History}",
          B: "{Charlie |-> Art, David |-> English, Eve |-> Music}",
          C: "{Charlie, David, Eve}",
          D: "{Art, English, Music}"
        },
        correct: "B",
        explanation: "Range anti-restriction removes maplets pointing into {Math, Science, History}."
      },
      {
        id: "Q5",
        category: "Functions",
        question: "A system mandates mapping every registered Employee to a unique system ID. Every employee must have an ID, no two employees share an ID, and some IDs may remain unassigned. Which B function arrow models this?",
        options: {
          A: "hasEmployeeID : Employee +-> ID",
          B: "hasEmployeeID : Employee -->> ID",
          C: "hasEmployeeID : Employee >-> ID",
          D: "hasEmployeeID : Employee >->> ID"
        },
        correct: "C",
        explanation: "Totality + Injectivity + Non-surjectivity = Total Injection (>->)."
      },
      {
        id: "Q6",
        category: "Functions",
        question: "Given Vehicle = {Car, Bus, Bike, Boat, Plane} and Fuel = {Petrol, Diesel, Electric, None}, with fuelType = {Car|->Petrol, Bus|->Diesel, Bike|->Electric, Boat|->Diesel, Plane|->Petrol}, what is the classification of fuelType?",
        options: {
          A: "Total Function (Vehicle --> Fuel)",
          B: "Total Injection (Vehicle >-> Fuel)",
          C: "Partial Function (Vehicle +-> Fuel)",
          D: "Total Bijection (Vehicle >->> Fuel)"
        },
        correct: "A",
        explanation: "Total because dom = Vehicle; not injective because Car and Plane share Petrol; not surjective because None is unused."
      },
      {
        id: "Q7",
        category: "Predicate Logic",
        question: "Given A = {4, 6, 10} and B = {2, 3, 5}, evaluate Predicate 1: !(xx).(xx : A => #(yy).(yy : B & xx mod yy = 0)) and Predicate 2: #(yy).(yy : B & !(xx).(xx : A => xx mod yy = 0)).",
        options: {
          A: "Predicate 1 is True; Predicate 2 is True",
          B: "Predicate 1 is True; Predicate 2 is False",
          C: "Predicate 1 is False; Predicate 2 is True",
          D: "Predicate 1 is False; Predicate 2 is False"
        },
        correct: "A",
        explanation: "yy = 2 in B divides all elements in A, satisfying both the existential check and universal check."
      },
      {
        id: "Q8",
        category: "Predicate Logic",
        question: "Given A = {1, 2, 3, 4, 5} and B = {2, 3, 5, 7} over NAT, which of the following logical statements evaluates to TRUE?",
        options: {
          A: "!(n).(n : A => n+1 : B)",
          B: "!(n).(n : A => #(m).(m : B & m < n))",
          C: "#(n).(n : A & !(m).(m : B => m < n))",
          D: "#(n).(n : B & n+1 : A)"
        },
        correct: "D",
        explanation: "For n = 2 in B, n + 1 = 3 which is in A. Thus #(n).(n : B & n+1 : A) holds true."
      },
      {
        id: "Q9",
        category: "Relations & Orders",
        question: "Let A = {1, 2, 3} and R = {(1,1), (2,2), (3,3), (1,2)}. Is R an equivalence relation on A?",
        options: {
          A: "Yes, R satisfies reflexivity, symmetry, and transitivity.",
          B: "No, R violates reflexivity.",
          C: "No, R is reflexive and transitive but violates symmetry.",
          D: "No, R is symmetric but violates transitivity."
        },
        correct: "C",
        explanation: "Contains identity pairs and transitive closure holds, but (1,2) is missing (2,1), violating symmetry."
      },
      {
        id: "Q10",
        category: "Relations & Orders",
        question: "On set A = {1, 2, 3}, which of the following relations constitutes an EQUIVALENCE RELATION?",
        options: {
          A: "R = {(1,1), (2,2), (1,2), (2,1), (1,3), (3,1)}",
          B: "R = {(1,1), (2,2), (3,3), (1,2)}",
          C: "R = {(1,1), (2,2), (3,3), (1,2), (2,1), (2,3), (3,2), (1,3), (3,1)}",
          D: "R = {(1,1), (2,2), (3,3), (1,2), (2,1), (1,3), (3,1)}"
        },
        correct: "C",
        explanation: "Option C includes all identity pairs and is the full Cartesian product A x A, satisfying reflexivity, symmetry, and transitivity."
      },
      {
        id: "Q11",
        category: "Abstract Machine Notation",
        question: "In B-Method, if operation addNewHouse(newHouse) has precondition PRE newHouse : NAT1 & newHouse /: houseNumbers THEN houseNumbers := houseNumbers \\/ {newHouse} END, what occurs if invoked when newHouse /: houseNumbers is False?",
        options: {
          A: "The machine automatically invokes an ELSE fallback path and ignores the operation.",
          B: "A precondition contract violation occurs, invalidating proof obligations and causing undefined behavior.",
          C: "The machine adds the duplicate value to houseNumbers without throwing an exception.",
          D: "The variable houseNumbers is re-initialized to the empty set {}."
        },
        correct: "B",
        explanation: "In B specifications, preconditions define caller obligations. A violation produces undefined state behavior."
      }
    ];

    let currentQuestions = [];
    let currentIndex = 0;
    let score = 0;
    let questionsAttempted = 0;
    let selectedOption = null;
    let isSubmitted = false;
    let selectedDay = 1;

    const quizApp = document.getElementById('quizApp');
    const daySelector = document.getElementById('daySelector');

    daySelector.addEventListener('click', (e) => {
      const btn = e.target.closest('.day-btn');
      if (!btn) return;
      document.querySelectorAll('.day-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      selectedDay = parseInt(btn.getAttribute('data-day'), 10) || 1;
      fetchQuestions(selectedDay);
    });

    async function fetchQuestions(day) {
      quizApp.innerHTML = '<div class="status-msg">Loading practice batch...</div>';

      try {
        const response = await fetch(`${APPS_SCRIPT_URL}?day=${day}`, {
          method: 'GET',
          redirect: 'follow'
        });

        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const data = await response.json();

        if (data && data.questions && data.questions.length > 0) {
          currentQuestions = data.questions;
        } else {
          currentQuestions = getFallbackBatch(day);
        }
      } catch (err) {
        console.warn('API fetch failed, loading local bank:', err);
        currentQuestions = getFallbackBatch(day);
      }

      currentIndex = 0;
      score = 0;
      questionsAttempted = 0;
      renderQuestion();
    }

    function getFallbackBatch(day) {
      if (day > 4) {
        return [...FALLBACK_QUESTIONS].sort(() => Math.random() - 0.5);
      }
      return [...FALLBACK_QUESTIONS];
    }

    function renderQuestion() {
      selectedOption = null;
      isSubmitted = false;

      const q = currentQuestions[currentIndex];
      const optKeys = ['A', 'B', 'C', 'D'];
      const totalQuestions = currentQuestions.length;

      // Calculate current percentage mark out of 100
      const currentMark = questionsAttempted > 0 
        ? Math.round((score / questionsAttempted) * 100) 
        : 0;

      quizApp.innerHTML = `
        <div class="meta-bar">
          <span class="category-badge">${escapeHtml(q.category || 'Formal Methods')}</span>
          <span class="score-badge">Q ${currentIndex + 1}/${totalQuestions} | Mark: <span>${currentMark}/100</span></span>
        </div>

        <div class="question-text">${escapeHtml(q.question)}</div>

        <div class="options-grid">
          ${optKeys.map(k => `
            <button class="option-btn" data-opt="${k}">
              <strong>${k}:</strong>
              <span>${escapeHtml(q.options[k] || '')}</span>
            </button>
          `).join('')}
        </div>

        <div id="feedbackContainer"></div>

        <div class="action-row">
          <button class="btn" id="actionBtn" disabled>Submit Answer</button>
        </div>
      `;

      // Option selection logic
      const optionButtons = quizApp.querySelectorAll('.option-btn');
      const actionBtn = document.getElementById('actionBtn');

      optionButtons.forEach(btn => {
        btn.addEventListener('click', () => {
          if (isSubmitted) return;
          optionButtons.forEach(b => b.classList.remove('selected'));
          btn.classList.add('selected');
          selectedOption = btn.getAttribute('data-opt');
          actionBtn.disabled = false;
        });
      });

      // Submit / Next button listener
      actionBtn.addEventListener('click', () => {
        if (!isSubmitted) {
          handleSubmit(q, actionBtn);
        } else {
          handleNext();
        }
      });
    }

    function handleSubmit(q, actionBtn) {
      isSubmitted = true;
      questionsAttempted++;

      const correct = String(q.correct).trim().toUpperCase();
      const isCorrect = selectedOption === correct;

      if (isCorrect) score++;

      // Compute mark out of 100 up to this question
      const currentMark = Math.round((score / questionsAttempted) * 100);

      // Disable choices & highlight correct/wrong
      const optionButtons = quizApp.querySelectorAll('.option-btn');
      optionButtons.forEach(btn => {
        btn.disabled = true;
        const opt = btn.getAttribute('data-opt');
        if (opt === correct) {
          btn.classList.add('correct');
        } else if (opt === selectedOption && !isCorrect) {
          btn.classList.add('incorrect');
        }
      });

      // Show feedback banner & explanation
      const feedbackContainer = document.getElementById('feedbackContainer');
      feedbackContainer.innerHTML = `
        <div class="feedback-banner ${isCorrect ? 'correct' : 'incorrect'}">
          ${isCorrect ? '✓ Correct Answer' : '✕ Incorrect Answer'} — Current Score: ${currentMark} / 100 (${currentMark}%)
        </div>
        ${q.explanation ? `
          <div class="explanation">
            <strong>Explanation:</strong>
            ${escapeHtml(q.explanation)}
          </div>
        ` : ''}
      `;

      // Update meta bar with new mark
      const scoreBadge = quizApp.querySelector('.score-badge span');
      if (scoreBadge) scoreBadge.innerText = `${currentMark}/100`;

      // Switch button to Next / Finish
      const isLastQuestion = currentIndex === currentQuestions.length - 1;
      actionBtn.innerText = isLastQuestion ? 'View Final Results' : 'Next Question';
      actionBtn.disabled = false;
    }

    function handleNext() {
      currentIndex++;
      if (currentIndex < currentQuestions.length) {
        renderQuestion();
      } else {
        renderCompletion();
      }
    }

    function renderCompletion() {
      const total = currentQuestions.length;
      const finalMark = total > 0 ? Math.round((score / total) * 100) : 0;

      quizApp.innerHTML = `
        <div class="score-screen">
          <h2>Quiz Completed</h2>
          <div class="score-num">${finalMark}<span style="font-size: 2rem; color: var(--text-muted);">/100</span></div>
          <div class="score-grade">${score} out of ${total} questions answered correctly</div>
          <button class="btn" style="margin: 0 auto;" onclick="fetchQuestions(selectedDay)">Retry Batch</button>
        </div>
      `;
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    // Initial load
    window.addEventListener('load', () => fetchQuestions(selectedDay));
  </script>
</body>
</html>
